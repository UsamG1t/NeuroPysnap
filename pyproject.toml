[project]
name = "vboxlab"
version = "2.2.1"
description = "VirtualBox appliance importer and linked clone manager."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "VBoxLab Authors" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = [
  "prompt_toolkit>=3.0.36",
  "pyte>=0.8.0",
]

[build-system]
# ``license = "MIT"`` uses the PEP 639 string form, which setuptools
# understands only from release 77 onward. Older setuptools rejects the
# whole ``[project]`` table, so the wheel build silently depends on a
# modern local toolchain when ``--no-isolation`` is used.
requires = ["setuptools>=77", "wheel>=0.38", "Sphinx>=7.2"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
build = [
  "setuptools>=77",
  "wheel>=0.38",
  "Sphinx>=7.2",
  "build>=1.0.0",
  "doit>=0.34.0",
]

[project.scripts]
vboxlab = "vboxlab.cli.app:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
vboxlab = ["docs/*", "docs/**/*"]

[tool.setuptools.packages.find]
include = ["vboxlab*"]
exclude = ["vboxlab.tests*"]
